# Bygger og pusher Docker-imaget til GHCR. Kører i tvmidtvest-forken.
#
# Tag'er du fx v0.18 (`git tag v0.18 && git push --tags`), bygges og pushes:
#   ghcr.io/tvmidtvest/ograf-studio:0.18, :sha-<commit>, :latest
# Dockerfilen henter upstream-releasens Linux-binary for samme tag, så tagget
# skal findes som release på zerodensity/ograf-studio.
#
# Efter push kaldes Portainer-webhook'en (secret PORTAINER_WEBHOOK) → auto-redeploy.
name: Build & push Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ograf_version:
        description: Upstream release-tag at pakke (fx v0.17)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream release tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.ograf_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OGRAF_VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer redeploy
        if: env.PORTAINER_WEBHOOK != ''
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK"
